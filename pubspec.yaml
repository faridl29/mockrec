name: mockrec
description: >-
  Record API responses once, replay without backend.
  Dio interceptor for offline development, testing, and demos — zero config.
version: 0.0.1
homepage: https://github.com/faridl29/mockrec
repository: https://github.com/faridl29/mockrec
issue_tracker: https://github.com/faridl29/mockrec/issues
documentation: https://github.com/faridl29/mockrec#readme
funding:
  - https://sociabuzz.com/faridl29/support
topics:
  - mock
  - api
  - dio
  - testing
  - interceptor

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  dio: ^5.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
